[project]
name = "finances-helper"
version = "0.1.0"
description = "YNAB budget assistant — Amazon enrichment, AI categorization, spending insights"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "anthropic>=0.50",
    "thefuzz>=0.22",
    "scipy>=1.11",
    "cmdstanpy>=1.3.0",
    "arviz>=0.23.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "diptest>=0.11.0",
    "bokeh>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: marks tests as integration tests that require live API access (deselect with '-m not integration')",
]

[tool.uv]
dev-dependencies = [
    "matplotlib>=3.10.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
